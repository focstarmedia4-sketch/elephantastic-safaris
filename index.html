    <title>Elephantastic Safaris</title>
    <script>
      // In AI Studio preview environment, HMR WebSockets are disabled.
      // Suppress unhandled WebSocket rejections from @vite/client.
      (function() {
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (
            (typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')) ||
            (typeof e.reason === 'string' && e.reason.includes('WebSocket')) ||
            (typeof e.reason.stack === 'string' && e.reason.stack.includes('@vite/client'))
          )) {
            e.preventDefault();
          }
        });
        window.addEventListener('error', function(e) {
          if (
            (typeof e.message === 'string' && e.message.includes('WebSocket')) ||
            (typeof e.filename === 'string' && e.filename.includes('@vite/client'))
          ) {
            e.preventDefault();
          }
        });
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'))) {
              const target = new EventTarget();
              target.readyState = 1;
              target.send = function() {};
              target.close = function() {};
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
